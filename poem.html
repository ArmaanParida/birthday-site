<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Poppins", sans-serif;
    }

    /* Background slideshow */
    .slideshow {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    .slideshow img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }
    .slideshow img.active {
      opacity: 1;
    }

    /* Poem box */
    .poem-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      max-width: 600px;
      height: 300px;
      overflow-y: auto;
      background: rgba(255, 192, 203, 0.35);
      backdrop-filter: blur(5px);
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      color: white;
      font-size: clamp(14px, 2.5vw, 20px);
      line-height: 1.6;
    }
    .poem-line {
      opacity: 0;
      animation: fadeInTyping 2s forwards;
      display: block;
    }
    @keyframes fadeInTyping {
      from { opacity: 0; filter: blur(5px); }
      to { opacity: 1; filter: blur(0); }
    }

    /* Music button */
    #unmute-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: rgba(255, 105, 180, 0.9);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <!-- Slideshow -->
  <div class="slideshow">
    <img src="IMG_20250916_090843.jpg" alt="Smiling moments" class="active">
    <img src="IMG_20250916_090900.jpg" alt="Special day">
    <img src="IMG_20250916_091207.jpg" alt="Forever memories">
    <img src="IMG_20250916_093906.jpg" alt="Us together">
    <img src="IMG_20250916_093939.jpg" alt="Us together">
    <img src="IMG_20250916_094004.jpg" alt="Us together">
  </div>

  <!-- Poem Box -->
  <div class="poem-box" id="poemBox">
    <p id="poem">
      Happy Birthday my love,<br>
      Every moment with you feels like a gift,<br>
      Your smile lights up my entire world,<br>
      And I’m blessed to walk this path with you,<br>
      Forever yours ❤️
    </p>
  </div>

  <!-- Music -->
  <audio id="bg-music" src="Perfect.mp3" autoplay loop></audio>
  <button id="unmute-btn">🔊</button>

  <script>
    // ----------------- Slideshow -----------------
    const slides = document.querySelectorAll(".slideshow img");
    let currentSlide = 0;
    setInterval(() => {
      slides[currentSlide].classList.remove("active");
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add("active");
    }, 4000);

    // ----------------- Poem Fade + Auto-scroll -----------------
    const poemElement = document.getElementById("poem");
    const poemBox = document.getElementById("poemBox");
    const rawLines = poemElement.innerHTML.split("<br>");
    poemElement.innerHTML = "";

    rawLines.forEach((line, index) => {
      const span = document.createElement("span");
      span.classList.add("poem-line");
      span.style.animationDelay = `${index * 2}s`;
      span.innerHTML = line.trim();
      poemElement.appendChild(span);
    });

    let autoScroll = true;
    let scrollTimeout;

    function scrollPoem() {
      if (autoScroll) {
        poemBox.scrollBy({ top: 1, behavior: "smooth" });
        if (poemBox.scrollTop + poemBox.clientHeight >= poemBox.scrollHeight) {
          poemBox.scrollTop = 0; // loop back
        }
      }
    }
    setInterval(scrollPoem, 100);

    poemBox.addEventListener("scroll", () => {
      autoScroll = false;
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => autoScroll = true, 5000); // resume after 5s
    });

    // ----------------- Music -----------------
    const audio = document.getElementById("bg-music");
    const unmuteBtn = document.getElementById("unmute-btn");

    audio.play().catch(() => { unmuteBtn.style.display = "block"; });

    function checkAudio() {
      if (audio.paused || audio.muted) {
        unmuteBtn.textContent = "🔇";
        unmuteBtn.style.display = "block";
      } else {
        unmuteBtn.textContent = "🔊";
        unmuteBtn.style.display = "block";
      }
    }
    setInterval(checkAudio, 1000);

    unmuteBtn.addEventListener("click", () => {
      if (audio.muted || audio.paused) {
        audio.muted = false;
        audio.play();
      } else {
        audio.muted = true;
      }
      checkAudio();
    });
  </script>
</body>
</html>
