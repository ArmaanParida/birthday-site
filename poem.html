<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meri Shayari Tumhare Liye ❤️</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body, html { height:100%; overflow:hidden; font-family: 'Arial', sans-serif; }
  body { background:black; }

  /* Slideshow */
  .slideshow { position:absolute; width:100%; height:100%; top:0; left:0; overflow:hidden; }
  .slideshow img { position:absolute; width:100%; height:100%; object-fit:cover; opacity:0; transition: opacity 1s ease-in-out; }
  .slideshow img.active { opacity:1; }

  /* Translucent poem box */
  .poem-box {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%, -50%);
    width:90%; max-width:700px;
    max-height:80%;
    background: rgba(255, 192, 203, 0.4);
    color:black;
    padding:20px;
    border-radius:15px;
    overflow-y:auto;
    font-size:18px;
    line-height:1.5;
    text-align:center;
  }

  /* Scrollbar hidden */
  .poem-box::-webkit-scrollbar { display:none; }
  .poem-box { -ms-overflow-style:none; scrollbar-width:none; }

  /* Poem line fade-in */
  .poem-line { opacity:0; transition: opacity 1s ease; }

  /* Music button */
  #musicBtn {
    position:fixed; bottom:20px; right:20px;
    background:#ff69b4; color:black;
    border:none; padding:12px 18px; border-radius:50%;
    cursor:pointer; font-weight:bold;
    z-index:10;
  }
</style>
</head>
<body>

<!-- Slideshow -->
<div class="slideshow">
  <img src="IMG_20250916_090843.jpg" alt="Smiling moments" class="active">
  <img src="IMG_20250916_090900.jpg" alt="Special day">
  <img src="IMG_20250916_091207.jpg" alt="Forever memories">
  <img src="IMG_20250916_093906.jpg" alt="Us together">
  <img src="IMG_20250916_093939.jpg" alt="Us together">
  <img src="IMG_20250916_094004.jpg" alt="Us together">
  <img src="IMG_20250916_231640.jpg" alt="Us together">
  <img src="IMG_20250916_231703.jpg" alt="Us together">
  <img src="IMG_20250916_231724.jpg" alt="Us together">
  <img src="IMG_20250916_231744.jpg" alt="Us together">
  <img src="IMG_20250916_231806.jpg" alt="Us together">
  <img src="IMG_20250916_231833.jpg" alt="Us together">
</div>

<!-- Poem box -->
<div class="poem-box" id="poemBox"></div>

<!-- Music -->
<audio id="bgMusic" src="Perfect.mp3" loop></audio>
<button id="musicBtn">🔇</button>

<script>
/* ----------------- Slideshow ----------------- */
const slides = document.querySelectorAll('.slideshow img');
let current = 0;
function nextSlide(dir=1){
  slides[current].classList.remove('active');
  current = (current + dir + slides.length) % slides.length;
  slides[current].classList.add('active');
}
setInterval(()=>nextSlide(1), 3500);

let startX = null;
document.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; });
document.addEventListener('touchend', e=>{
  if(startX===null) return;
  let diff = e.changedTouches[0].clientX - startX;
  if(diff>50) nextSlide(-1);
  else if(diff<-50) nextSlide(1);
  startX=null;
});

/* ----------------- Poem fade-in typing & scrolling ----------------- */
const poemBox = document.getElementById('poemBox');
const poemLines = [
  "Janamdin mubarak ho, meri roshni, meri jaan,",
  "Har pal tere saath, lagta hai khushiyon ka samaan.",
  "Teri hasi hai sangeet, tera muskaan mera ujala,",
  "Tere saath har lamha, hai jaise ek pyara sa kissa.",

  "Har ek pal mein, khushi aur dard ke safar mein,",
  "Main shukriya ada karta hoon, meri zindagi ke pyare palon mein.",
  "Har dhadkan ke saath, badhta jaa raha hai mera pyaar,",
  "Teri yaadon ko sambhal ke rakhta hoon, dil ke andar yeh ikraar.",

  "Chhoti si baatein, hasi mazaak ke pal,",
  "Haath mein haath, raat ke chaand ke sang chal,",
  "Tu meri prerana, meri muskaan, mera saath,",
  "Aaj aur hamesha, khush hoon main ki tu mere paas.",

  "Teri dayalu muskaan, roshni kar deti hai din mera,",
  "Chhoti chhoti baaton mein, tu hai yaadon ka sahara mera.",
  "Tu hansi hai, tu khushi hai, tu meri poori duniya ka sukoon,",
  "Jo tere saath ho, uska dil sada khushiyon ka ho junoon.",

  "Yeh chhoti si shayari, sirf tere liye likhi maine,",
  "Ek chhoti si nishani pyaar ki, jo hai sacchi aur pyari jaise dhadkan ka raag.",
  "Iss saal teri zindagi mein ho khushi, hasi aur rangon ka jahan,",
  "Kyuki tere saath hai zindagi meri, har pal bas teri hi pehchaan.",

  "Main wada karta hoon, hamesha tere saath rahunga,",
  "Har pal pyaar aur mohabbat se, tere sapne mein shaamil rahunga.",
  "Har khwaab jo tu dekhegi, usme main bhi hoon shamil,",
  "Tere khushi ke liye, main kuch bhi kar jaaunga, har pal aur har lamha khil.",
  
  "Log kehte hain tu chaand ka tukda lagti hai,",
  "Mein kehta hoon chaand tera tukda lagta hai.", 
  "Kyunki taadne walo ko kya pata... Niharna kya hota hai,",
  "Saara sheher ghoom liya, saara sheher kaafi nahi tha,",
  "Par jab teri aankhon ko dekha... Aur kuch baaki nahi tha."
  
  "Janamdin mubarak ho, meri jaan, meri roshni, meri dhadkan,",
  "Tere saath meri zindagi hai, jaise chaand aur sitare sath sath.",
  "Aaj, kal aur har naye din mein,",
  "Main hamesha tujhe chahunga, pyar karunga aur tera saath nibhaunga.",

  
];

let lineIndex=0;
function typeLine(){
  if(lineIndex<poemLines.length){
    let lineText = poemLines[lineIndex];
    let lineDiv = document.createElement('div');
    lineDiv.className='poem-line';
    poemBox.appendChild(lineDiv);

    let cIndex=0;
    function typeChar(){
      if(cIndex<lineText.length){
        lineDiv.innerHTML += lineText[cIndex];
        cIndex++;
        setTimeout(typeChar, 40 + Math.random()*30);
      } else {
        lineDiv.style.opacity=1;
        lineIndex++;
        setTimeout(typeLine,200);
      }
    }
    typeChar();
  }
}
typeLine();

/* Auto-scroll like lyrics */
let autoScroll=true;
function scrollPoem(){
  if(autoScroll){
    poemBox.scrollTop += 0.5;
  }
  requestAnimationFrame(scrollPoem);
}
scrollPoem();
poemBox.addEventListener('wheel', ()=>{ autoScroll=false; });
poemBox.addEventListener('touchstart', ()=>{ autoScroll=false; });

/* ----------------- Music ----------------- */
const musicBtn = document.getElementById('musicBtn');
const bgMusic = document.getElementById('bgMusic');
let firstInteraction = false;

function updateBtn(){
  if(bgMusic.paused || bgMusic.muted) {
    musicBtn.textContent = '🔇';
  } else {
    musicBtn.textContent = '⏸';
  }
}

// try autoplay (might fail due to browser)
bgMusic.play().then(()=>{
  updateBtn();
}).catch(()=>{
  bgMusic.muted = true;
  updateBtn();
});

// play on first click anywhere
document.body.addEventListener('click', () => {
  if (!firstInteraction) {
    bgMusic.muted = false;
    bgMusic.play().catch(()=>{});
    updateBtn();
    firstInteraction = true;
  }
});

// toggle with button
musicBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  if(bgMusic.paused){
    bgMusic.muted = false;
    bgMusic.play();
  } else {
    bgMusic.pause();
  }
  updateBtn();
});

updateBtn();
</script>

</body>
</html>
