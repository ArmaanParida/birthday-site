<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meri Shayari Tumhare Liye ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body, html { height:100%; overflow:hidden; font-family: 'Merriweather', serif; }
  body { background:black; }

  /* Slideshow */
  .slideshow { position:absolute; width:100%; height:100%; top:0; left:0; overflow:hidden; }
  .slideshow img { position:absolute; width:100%; height:100%; object-fit:cover; opacity:0; transition: opacity 1s ease-in-out; }
  .slideshow img.active { opacity:1; }

  /* Translucent poem box */
  .poem-box {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%, -50%);
    width:90%; max-width:700px;
    max-height:80%;
    background: rgba(255, 192, 203, 0.4);
    color:black;
    padding:20px;
    border-radius:15px;
    overflow-y:auto;
    font-size:18px;
    line-height:1.8;
    text-align:center;
  }

  /* Scrollbar hidden */
  .poem-box::-webkit-scrollbar { display:none; }
  .poem-box { -ms-overflow-style:none; scrollbar-width:none; }

  /* Poem line fade-in + stanza spacing */
  .poem-line { opacity:0; transition: opacity 1s ease; margin-bottom:16px; }

  /* Music button */
  #musicBtn {
    position:fixed; bottom:20px; right:20px;
    background:#ff69b4; color:black;
    border:none; padding:12px 18px; border-radius:50%;
    cursor:pointer; font-weight:bold;
    z-index:10;
  }
 /* Mobile font tweak */
  @media (max-width: 480px) {
    .poem-box { font-size:16px; }
  }

</style>
</head>
<body>

<!-- Slideshow -->
<div class="slideshow">
  <img src="IMG_20250916_090843.jpg" alt="Smiling moments" class="active">
  <img src="IMG_20250916_090900.jpg" alt="Special day">
  <img src="IMG_20250916_091207.jpg" alt="Forever memories">
  <img src="IMG_20250916_093906.jpg" alt="Us together">
  <img src="IMG_20250916_093939.jpg" alt="Us together">
  <img src="IMG_20250916_094004.jpg" alt="Us together">
  <img src="IMG_20250916_231640.jpg" alt="Us together">
  <img src="IMG_20250916_231703.jpg" alt="Us together">
  <img src="IMG_20250916_231724.jpg" alt="Us together">
  <img src="IMG_20250916_231744.jpg" alt="Us together">
  <img src="IMG_20250916_231806.jpg" alt="Us together">
  <img src="IMG_20250916_231833.jpg" alt="Us together">
</div>

<!-- Poem box -->
<div class="poem-box" id="poemBox"></div>

<!-- Music -->
<audio id="bgMusic" src="Perfect.mp3" loop muted></audio>
<button id="musicBtn">🔊</button>

<script>
/* ----------------- Slideshow ----------------- */
const slides = document.querySelectorAll('.slideshow img');
let current = 0;
function nextSlide(dir=1){
  slides[current].classList.remove('active');
  current = (current + dir + slides.length) % slides.length;
  slides[current].classList.add('active');
}
setInterval(()=>nextSlide(1), 3500);

let startX = null;
document.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; });
document.addEventListener('touchend', e=>{
  if(startX===null) return;
  let diff = e.changedTouches[0].clientX - startX;
  if(diff>50) nextSlide(-1);
  else if(diff<-50) nextSlide(1);
  startX=null;
});

/* ----------------- Poem fade-in typing & scrolling ----------------- */
const poemBox = document.getElementById('poemBox');
const poemLines = [
  "Janmadin ki shubhkamnayein, meri pyaari roshni,",
  "Har din tumhare saath lagta hai sabse khaas.",
  "Tumhari hasi hai sangeet, tumhari muskaan meri roshni,",
  "Tum hi ho jo sab kuch roshan kar dete ho.",

  "Har pal, har khushi aur har dukh mein,",
  "Main aabhari hoon tumhara, meri zindagi ke liye.",
  "Har dhadkan ke saath, mera pyaar gehra hota hai,",
  "Tumhare yaadein mere liye hamesha anmol rahengi.",

  "Masti bhari baatein ya shaant pal,",
  "Haath mein haath ya chandni raat ke pal,",
  "Tum meri prerna, mera sukoon, meri khushi ho,",
  "Aaj aur hamesha, khush hoon ki tum mere paas ho.",

  "Tumhari dayalu aur pyaari baatein roshan kar deti hain din,",
  "Itni chhoti chhoti baatein, par yaadgar hamesha rahengi.",
  "Tum mujhe hasate ho, mujhe poora mehsoos karvate ho,",
  "Jo tum hamesha meri rooh mein bas gayi ho.",

  "Yeh chhoti si shayari, sirf tumhare liye,",
  "Ek chhoti si nishani, sach aur pyaar bhari.",
  "Is saal tumhe khushi, hasi aur masti mile,",
  "Kyunki tumhare saath, zindagi ki sirf ye shuruaat hai.",

  "Janmadin mubarak ho, meri rooh, meri muskaan, mera pyaar,",
  "Tumhare saath, meri zindagi hamesha rangeen hai.",
  "Aaj, kal aur har din naye tareeke se,",
  "Main tumhe pyar karunga, pyaar karunga aur hamesha pyaar karta rahunga.",

  "Log kehte hain tu chaand ka tukda lagti hai,",
  "Mein kehta hoon chaand tera tukda lagta hai.", 
  "Kyunki taadne walo ko kya pata... Niharna kya hota hai",
  "Saara sheher ghoom liya, saara sheher kaafi nhi tha",
  "Par jab teri aankhon ko dekha... Aur kuch baaki nhi tha",

  "Mujhe bas tumhari khushi chahiye, aur main kuch bhi kar jaunga sirf tumhari muskaan ke liye."
];

let lineIndex=0;
function typeLine(){
  if(lineIndex<poemLines.length){
    let lineText = poemLines[lineIndex];
    let lineDiv = document.createElement('div');
    lineDiv.className='poem-line';
    poemBox.appendChild(lineDiv);

    let cIndex=0;
    function typeChar(){
      if(cIndex<lineText.length){
        lineDiv.innerHTML += lineText[cIndex];
        cIndex++;
        setTimeout(typeChar, 40 + Math.random()*30);
      } else {
        lineDiv.style.opacity=1;
        lineIndex++;
        setTimeout(typeLine,200);
      }
    }
    typeChar();
  }
}
typeLine();

/* Auto-scroll like lyrics */
let autoScroll=true;
function scrollPoem(){
  if(autoScroll){
    poemBox.scrollTop += 0.5;
  }
  requestAnimationFrame(scrollPoem);
}
scrollPoem();
poemBox.addEventListener('wheel', ()=>{ autoScroll=false; });
poemBox.addEventListener('touchstart', ()=>{ autoScroll=false; });

/* ----------------- Music autoplay & play/pause ----------------- */
const musicBtn = document.getElementById('musicBtn');
const bgMusic = document.getElementById('bgMusic');
let firstClick=false;

function updateBtn(){
  musicBtn.textContent = bgMusic.paused || bgMusic.muted ? '🔇' : '⏸';
}

// Attempt autoplay (usually muted)
bgMusic.play().catch(()=>{ bgMusic.muted=true; updateBtn(); });

// Click anywhere to start
document.body.addEventListener('click', () => {
  if(!firstClick){
    bgMusic.muted=false;
    bgMusic.play().catch(()=>{});
    updateBtn();
    firstClick=true;
  }
});

// Button toggle
musicBtn.addEventListener('click', e=>{
  e.stopPropagation();
  if(bgMusic.paused){
    bgMusic.muted=false;
    bgMusic.play();
  } else {
    bgMusic.pause();
  }
  updateBtn();
});

bgMusic.addEventListener('volumechange', updateBtn);
updateBtn();
</script>

</body>
</html>
