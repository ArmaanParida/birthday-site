<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Poem for You ❤️</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body, html { height:100%; overflow:hidden; font-family: 'Arial', sans-serif; }
  body { background:black; }

  /* Slideshow */
  .slideshow { position:absolute; width:100%; height:100%; top:0; left:0; overflow:hidden; }
  .slideshow img { position:absolute; width:100%; height:100%; object-fit:cover; opacity:0; transition: opacity 1s ease-in-out; }
  .slideshow img.active { opacity:1; }

  /* Translucent poem box */
  .poem-box {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%, -50%);
    width:90%; max-width:700px;
    max-height:80%;
    background: rgba(255, 192, 203, 0.4);
    color:black;
    padding:20px;
    border-radius:15px;
    overflow-y:auto;
    font-size:18px;
    line-height:1.5;
    text-align:center;
  }

  /* Scrollbar hidden */
  .poem-box::-webkit-scrollbar { display:none; }
  .poem-box { -ms-overflow-style:none; scrollbar-width:none; }

  /* Poem line fade-in */
  .poem-line { opacity:0; transition: opacity 1s ease; }

  /* Music button */
  #musicBtn {
    position:fixed; bottom:20px; right:20px;
    background:#ff69b4; color:black;
    border:none; padding:12px 18px; border-radius:50%;
    cursor:pointer; font-weight:bold;
    z-index:10;
  }
</style>
</head>
<body>

<!-- Slideshow -->
<div class="slideshow">
  <img src="IMG_20250916_090843.jpg" alt="Smiling moments" class="active">
  <img src="IMG_20250916_090900.jpg" alt="Special day">
  <img src="IMG_20250916_091207.jpg" alt="Forever memories">
  <img src="IMG_20250916_093906.jpg" alt="Us together">
  <img src="IMG_20250916_093939.jpg" alt="Us together">
  <img src="IMG_20250916_094004.jpg" alt="Us together">
  <img src="IMG_20250916_231640.jpg" alt="Us together">
  <img src="IMG_20250916_231703.jpg" alt="Us together">
  <img src="IMG_20250916_231724.jpg" alt="Us together">
  <img src="IMG_20250916_231744.jpg" alt="Us together">
  <img src="IMG_20250916_231806.jpg" alt="Us together">
  <img src="IMG_20250916_231833.jpg" alt="Us together">
</div>

<!-- Poem box -->
<div class="poem-box" id="poemBox"></div>

<!-- Music -->
<audio id="bgMusic" src="Perfect.mp3" autoplay loop></audio>
<button id="musicBtn">🔊</button>

<script>
/* ----------------- Slideshow ----------------- */
const slides = document.querySelectorAll('.slideshow img');
let current = 0;
function nextSlide(dir=1){
  slides[current].classList.remove('active');
  current = (current + dir + slides.length) % slides.length;
  slides[current].classList.add('active');
}
setInterval(()=>nextSlide(1), 3500);

let startX = null;
document.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; });
document.addEventListener('touchend', e=>{
  if(startX===null) return;
  let diff = e.changedTouches[0].clientX - startX;
  if(diff>50) nextSlide(-1);
  else if(diff<-50) nextSlide(1);
  startX=null;
});

/* ----------------- Poem fade-in typing & scrolling ----------------- */
const poemBox = document.getElementById('poemBox');
const poemLines = [
  "Happy Birthday, my love, my shining star,",
  "Every day with you feels like the best by far.",
  "Your laughter is music, your smile, my light,",
  "You make even the ordinary feel so bright.",

  "Through every moment, through joy and through strife,",
  "I’m grateful for you, my love, my life.",
  "With every heartbeat, my feelings grow deep,",
  "Memories of you are treasures I keep.",

  "From silly jokes to quiet, gentle talks,",
  "From hand-in-hand walks to late-night moon walks,",
  "You’re my inspiration, my comfort, my cheer,",
  "Today and always, I’m so glad you’re near.",

  "Your kindness and care light up my days,",
  "In so many little, unforgettable ways.",
  "You make me laugh, you make me feel whole,",
  "The one who’s etched forever in my soul.",

  "So here’s a poem, written just for you,",
  "A small token of love, honest and true.",
  "May this year bring you joy, laughter, and fun,",
  "Because with you, my love, life’s only just begun.",

  "I promise to stand by you, come what may,",
  "To cherish, to love, in every possible way.",
  "For every dream you dream, I’ll be there to see,",
  "Because your happiness means the world to me.",

  "Happy Birthday, my heart, my light, my muse,",
  "With you, my life feels forever infused.",
  "Today, tomorrow, and every day anew,",
  "I’ll celebrate, adore, and endlessly love you.",
  "Log kehte hain tu kya chaand ka tukda lag rhi hai",
  "Mein kehta hoon chaand hamesha tera tukda lagta hai.",
  "Esi khoobsoorti, jo sirf tujhpe hi subhae",
  "Tujhe dekh kar toh... Chaand taare bhi sharma jaye",
  "I know how happy you must be, reading this.... and that happiness is all I care about and would do absolutely anything to see you be happy everytime."
];

let lineIndex=0, charIndex=0, autoScroll=true;

function typeLine(){
  if(lineIndex<poemLines.length){
    let lineText = poemLines[lineIndex];
    let lineDiv = document.createElement('div');
    lineDiv.className='poem-line';
    poemBox.appendChild(lineDiv);

    let cIndex=0;
    function typeChar(){
      if(cIndex<lineText.length){
        lineDiv.innerHTML += lineText[cIndex];
        cIndex++;
        setTimeout(typeChar, 40 + Math.random()*30);
      } else {
        lineDiv.style.opacity=1;
        lineIndex++;
        setTimeout(typeLine,200);
      }
    }
    typeChar();
  }
}
typeLine();

/* Auto-scroll like lyrics */
function scrollPoem(){
  if(autoScroll){
    poemBox.scrollTop += 0.5;
  }
  requestAnimationFrame(scrollPoem);
}
scrollPoem();
poemBox.addEventListener('wheel', ()=>{ autoScroll=false; });
poemBox.addEventListener('touchstart', ()=>{ autoScroll=false; });

/* ----------------- Music button ----------------- */
const musicBtn = document.getElementById('musicBtn');
const bgMusic = document.getElementById('bgMusic');

function updateBtn(){
  musicBtn.textContent = bgMusic.muted ? '🔇' : '🔊';
}

musicBtn.addEventListener('click', ()=>{
  bgMusic.muted = !bgMusic.muted;
  updateBtn();
});
bgMusic.addEventListener('volumechange', updateBtn);
updateBtn();
</script>

</body>
</html>
