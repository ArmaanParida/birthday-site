<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom, #ffdde1, #ee9ca7);
      color: #333;
      text-align: center;
      padding: 30px;
      overflow: hidden; /* for hearts */
    }

    h1 {
      font-size: 3rem;
      color: #d6336c;
      animation: fadeIn 2s ease-in-out;
    }

    #poem {
      font-size: 1.2rem;
      max-width: 600px;
      margin: auto;
      line-height: 1.6;
      white-space: pre-line; /* keeps line breaks */
      border-right: 2px solid #d6336c;
      display: inline-block;
      text-align: left;
      overflow: hidden;
    }

    .gallery img {
      width: 200px;
      border-radius: 15px;
      margin: 10px;
      transition: transform 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.1);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Falling hearts */
    .heart {
      position: fixed;
      top: -10px;
      font-size: 24px;
      color: #d6336c;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>Happy Birthday, My Love ❤️</h1>
  
  <p id="poem"></p>

  <div class="gallery">
    <!-- Add your photos here -->
    <img src="photo1.jpg" alt="Us 1">
    <img src="photo2.jpg" alt="Us 2">
    <img src="photo3.jpg" alt="Us 3">
  </div>

  <script>
    // Typing effect
    const poemText = `Roses are red, skies are blue,
Every heartbeat whispers, "I love you."
With every smile, my world feels new,
Forever and always, I'm yours, it’s true.`;

    let i = 0;
    function typePoem() {
      if (i < poemText.length) {
        document.getElementById("poem").innerHTML += poemText.charAt(i);
        i++;
        setTimeout(typePoem, 60); // typing speed
      }
    }
    typePoem();

    // Falling hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (3 + Math.random() * 3) + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }
    setInterval(createHeart, 500);
  </script>
</body>
</html>
