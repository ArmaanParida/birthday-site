<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intro ❤️</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Consolas", "Courier New", monospace;
      color: #00ff00;
      text-align: center;
      opacity: 1;
    }
    .intro-box {
      max-width: 600px;
    }
    .line {
      display: block;
      white-space: pre-wrap;
      font-size: 18px;
      line-height: 1.3;
    }
    #cursor {
      display: inline-block;
      width: 10px;
      height: 18px; 
      background-color: #00ff00;
      margin-left: 2px;
      animation: blink 1s step-start infinite;
      vertical-align: bottom;
      transition: opacity 0.7s;
      margin-top: 5px;
    }
    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }
    #showBtn {
      margin-top: 30px;
      padding: 15px 25px;
      font-size: 16px;
      background: #00ff00;
      color: black;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      transition: box-shadow 0.3s, transform 0.3s;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00; transform: scale(1); }
      50% { box-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00; transform: scale(1.05); }
      100% { box-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00; transform: scale(1); }
    }
    #showBtn.pulse {
      animation: pulse 1s infinite;
    }
    #showBtn:hover {
      box-shadow: 0 0 25px #00ff00, 0 0 50px #00ff00;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="intro-box" id="introBox">
    <button id="showBtn">SHOW ME THE POEM!!!!</button>
    <span id="cursor"></span>
  </div>

  <script>
    const lines = [
      "Happy Birthday my love,",
      "Every moment with you feels like a gift,",
      "Your smile lights up my entire world...",
      "Here's a poem I wrote to express my love and gratitude for you 💖"
    ];

    const introBox = document.getElementById("introBox");
    const cursor = document.getElementById("cursor");
    const showBtn = document.getElementById("showBtn");

    let lineIndex = 0;
    let charIndex = 0;
    const pauses = {0:[5],2:[10]};

    function typeLine() {
      if(lineIndex < lines.length){
        let line = lines[lineIndex];

        // Create line div if it doesn't exist
        let lineDiv = introBox.querySelectorAll('.line')[lineIndex];
        if(!lineDiv){
          lineDiv = document.createElement('div');
          lineDiv.className = 'line';
          introBox.insertBefore(lineDiv, cursor); // insert before cursor
        }

        // Thinking pause
        if(pauses[lineIndex] && pauses[lineIndex].includes(charIndex)){
          setTimeout(()=>{
            charIndex++;
            typeLine();
          },700);
          return;
        }

        if(charIndex < line.length){
          lineDiv.innerHTML += line.charAt(charIndex);
          charIndex++;
          const delay = 50 + Math.random()*70;
          setTimeout(typeLine, delay);
        }else{
          lineIndex++;
          charIndex=0;
          setTimeout(typeLine,300);
        }
      }else{
        // Finished typing, fade out cursor
        cursor.style.opacity=0;
        showBtn.style.display="inline-block";
        showBtn.classList.add("pulse");
      }
    }

    typeLine();

    showBtn.addEventListener("click",()=>{
      document.body.style.transition="opacity 1s";
      document.body.style.opacity=0;
      setTimeout(()=>{window.location.href="poem.html"},1000);
    });
  </script>
</body>
</html>
