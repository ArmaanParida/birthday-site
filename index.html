<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: black;
    }

    .slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
    }

    .slideshow img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .slideshow img.active {
      opacity: 1;
    }

    .poem-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 12px;
      width: 80%;
      max-width: 500px;
      height: 200px;
      overflow-y: auto;
      text-align: center;
      font-size: clamp(14px, 3vw, 20px);
      color: white;
    }

    /* Fade-in animation for lines */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .poem-line {
      opacity: 0;
      animation: fadeIn 1s forwards;
    }

    /* Scrollbar styling (optional, nice touch) */
    .poem-box::-webkit-scrollbar {
      width: 6px;
    }
    .poem-box::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.5);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <!-- Background Slideshow -->
  <div class="slideshow">
    <img src="IMG_20250916_090843.jpg" alt="Smiling moments">
    <img src="IMG_20250916_090900.jpg" alt="Special day">
    <img src="IMG_20250916_091207.jpg" alt="Forever memories">
    <img src="IMG_20250916_093906.jpg" alt="Us together">
    <img src="IMG_20250916_093939.jpg" alt="Us together">
    <img src="IMG_20250916_094004.jpg" alt="Us together">
  </div>

  <!-- Poem Box -->
  <div class="poem-box"></div>

  <!-- Background Music -->
  <audio id="bg-music" src="Perfect.mp3" autoplay loop></audio>
  <button id="unmute-btn" style="
    position: absolute; 
    bottom: 20px; 
    right: 20px; 
    padding: 10px 15px; 
    border: none; 
    border-radius: 8px; 
    background: rgba(255,192,203,0.8); 
    cursor: pointer;
    display: none;">
    🔊 Unmute
  </button>

  <script>
    // -------------------- SLIDESHOW --------------------
    const slides = document.querySelectorAll(".slideshow img");
    let current = 0;

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.remove("active");
        if (i === index) slide.classList.add("active");
      });
    }

    function nextSlide() {
      current = (current + 1) % slides.length;
      showSlide(current);
    }

    showSlide(current);
    setInterval(nextSlide, 4000); // change every 4s

    // -------------------- POEM --------------------
    const poemText = [
      "Line 1 of your poem...",
      "Line 2 of your poem...",
      "Line 3 of your poem...",
      "Line 4 of your poem...",
      "Keep adding as many as you like..."
    ];

    const poemBox = document.querySelector(".poem-box");
    let autoScroll = true;

    function typePoem(lines, speed = 2000) {
      let index = 0;
      const interval = setInterval(() => {
        if (index < lines.length) {
          const line = document.createElement("p");
          line.textContent = lines[index];
          line.classList.add("poem-line"); // fade-in effect
          poemBox.appendChild(line);

          // Auto-scroll only if user hasn’t scrolled manually
          if (autoScroll) {
            poemBox.scrollTop = poemBox.scrollHeight;
          }
          index++;
        } else {
          clearInterval(interval);
        }
      }, speed);
    }

    // Stop auto scroll if user scrolls manually
    poemBox.addEventListener("scroll", () => {
      if (poemBox.scrollTop + poemBox.clientHeight < poemBox.scrollHeight - 10) {
        autoScroll = false;
      }
    });

    typePoem(poemText, 2000); // type line every 2s

    // -------------------- MUSIC --------------------
    const music = document.getElementById("bg-music");
    const unmuteBtn = document.getElementById("unmute-btn");

    // Try to play immediately
    music.play().catch(() => {
      // If blocked, show button
      unmuteBtn.style.display = "block";
    });

    unmuteBtn.addEventListener("click", () => {
      music.play();
      unmuteBtn.style.display = "none";
    });
  </script>
</body>
</html>
