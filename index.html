<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intro ❤️</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Consolas", "Courier New", monospace;
      color: #00ff00;
      text-align: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 600px;
    }
    .line {
      display: block;
      white-space: pre-wrap;
      font-size: clamp(14px, 2.5vw, 20px);
      line-height: 1.4;
    }
    #showBtn {
      margin-top: 30px;
      padding: 15px 25px;
      font-size: clamp(14px, 3vw, 18px);
      background: #00ff00;
      color: black;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }
    #showBtn.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="intro-box" id="introBox"></div>
    <button id="showBtn" onclick="location.href='poem.html'">SHOW ME THE POEM!!!!</button>
  </div>

  <script>
    const introBox = document.getElementById("introBox");
    const showBtn = document.getElementById("showBtn");

    const introText = [
      "Happy Birthday my love ❤️",
      "I wanted to make something special for you.",
      "So… here's a poem I wrote to express my love and gratitude."
    ];

    let lineIndex = 0;

    function typeLine() {
      if (lineIndex < introText.length) {
        let lineText = introText[lineIndex];
        let lineDiv = document.createElement("div");
        lineDiv.className = "line";
        introBox.appendChild(lineDiv);

        let charIndex = 0;
        function typeChar() {
          if (charIndex < lineText.length) {
            lineDiv.innerHTML += lineText[charIndex];
            charIndex++;
            setTimeout(typeChar, 50);
          } else {
            lineIndex++;
            setTimeout(typeLine, 400);
          }
        }
        typeChar();
      } else {
        // Show button after all lines are typed
        showBtn.classList.add("visible");
      }
    }

    typeLine();
  </script>
</body>
</html>
