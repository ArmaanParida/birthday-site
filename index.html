<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday ❤️</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }

    /* Background Slideshow */
    .slideshow {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    .slideshow img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      animation: fade 24s infinite;
    }
    .slideshow img:nth-child(1) { animation-delay: 0s; }
    .slideshow img:nth-child(2) { animation-delay: 6s; }
    .slideshow img:nth-child(3) { animation-delay: 12s; }
    .slideshow img:nth-child(4) { animation-delay: 18s; }

    @keyframes fade {
      0% { opacity: 0; }
      10% { opacity: 1; }
      25% { opacity: 1; }
      35% { opacity: 0; }
      100% { opacity: 0; }
    }

    /* Translucent Poem Box */
    .poem-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 192, 203, 0.7); /* pink translucent */
      padding: 20px 30px;
      border-radius: 15px;
      text-align: center;
      max-width: 90%;
      color: white;
      font-size: 20px;
      line-height: 1.5;
    }

    /* Fade-in lines */
    .line {
      opacity: 0;
      animation: fadeIn 2s forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Unmute button */
    #unmute-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 15px;
      background: rgba(255, 192, 203, 0.8);
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Background Slideshow -->
  <div class="slideshow">
    <img src="IMG_20250916_090822.jpg" class="active" alt="Us together">
        <img src="IMG_20250916_090843.jpg" alt="Smiling moments">
        <img src="IMG_20250916_090900.jpg" alt="Special day">
        <img src="IMG_20250916_091207.jpg" alt="Forever memories">
        <img src="IMG_20250916_093906.jpg" class="active" alt="Us together">
        <img src="IMG_20250916_093939.jpg" class="active" alt="Us together">
        <img src="IMG_20250916_094004.jpg" class="active" alt="Us together">
  </div>

  <!-- Poem Box -->
  <div class="poem-box" id="poem"></div>

  <!-- Music -->
  <audio id="bg-music" autoplay loop>
    <source src="Perfect.mp3" type="audio/mpeg">
  </audio>
  <button id="unmute-btn">🔊 Unmute</button>

  <script>
    const poemLines = [
      "Happy Birthday, my love ❤️",
      "Every moment with you feels magical ✨",
      "You are my smile, my comfort, my home 🌸",
      "Forever yours, always mine 💍"
    ];

    const poemBox = document.getElementById("poem");

    poemLines.forEach((line, i) => {
      setTimeout(() => {
        const span = document.createElement("div");
        span.className = "line";
        span.style.animationDelay = "0s";
        span.textContent = line;
        poemBox.appendChild(span);
      }, i * 2500);
    });

    // Music handling
    const music = document.getElementById("bg-music");
    const unmuteBtn = document.getElementById("unmute-btn");

    music.muted = true;
    unmuteBtn.style.display = "block";

    unmuteBtn.addEventListener("click", () => {
      music.muted = false;
      music.play();
      unmuteBtn.style.display = "none";
    });
  </script>
</body>
</html>
